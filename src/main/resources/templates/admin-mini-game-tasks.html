<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Задания мини-игры</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="container">

    <a th:href="@{/admin}"
       class="site-header-link">
        ← Вернуться в админку
    </a>


    <h1>
        🧩 Задания
    </h1>

    <h2 th:text="${miniGame.title}">
        Название игры
    </h2>

    <p th:text="${miniGame.description}">
        Описание игры
    </p>


    <!-- =========================
         ДОБАВЛЕНИЕ ЗАДАНИЯ
         ========================= -->

    <section class="admin-section">

        <h2>➕ Добавить задание</h2>


        <!-- =========================
             WORD / CROCODILE
             ========================= -->

        <form
                th:if="${miniGame.gameType != 'MEMORY'}"
                th:action="@{'/admin/mini-game/' + ${miniGame.id} + '/tasks/add'}"
                method="post"
        >

            <!-- WORD -->

            <div th:if="${miniGame.gameType == 'WORD'}">

                <input
                        type="text"
                        name="content"
                        placeholder="Задание / слово"
                        required
                >

                <input
                        type="text"
                        name="answer"
                        placeholder="Правильный ответ"
                        required
                >

            </div>


            <!-- CROCODILE -->

            <div th:if="${miniGame.gameType == 'CROCODILE'}">

                <input
                        type="text"
                        name="content"
                        placeholder="Слово или задание"
                        required
                >

                <!-- Для Крокодила answer автоматически
                     будет равен content в AdminController -->

                <input
                        type="hidden"
                        name="answer"
                        value=""
                >

            </div>


            <!-- Настройки Крокодила -->

            <div
                    th:if="${miniGame.gameType == 'CROCODILE'}"
                    class="crocodile-task-options"
            >

                <label>
                    Сложность

                    <select name="difficulty">

                        <option value="EASY">
                            🟢 Легко
                        </option>

                        <option value="MEDIUM">
                            🟡 Средне
                        </option>

                        <option value="HARD">
                            🔴 Сложно
                        </option>

                    </select>

                </label>


                <label>
                    Тип задания

                    <select name="taskType">

                        <option value="WORD">
                            🗣️ Слово или словосочетание
                        </option>

                        <option value="SITUATION">
                            🎭 Ситуация
                        </option>

                    </select>

                </label>

            </div>


            <button
                    type="submit"
                    class="button"
            >
                🧩 Добавить
            </button>

        </form>


        <!-- =========================
             MEMORY
             ========================= -->

        <form
                th:if="${miniGame.gameType == 'MEMORY'}"
                th:action="@{'/admin/mini-game/' + ${miniGame.id} + '/tasks/add'}"
                method="post"
        >

            <input
                    type="hidden"
                    name="content"
                    value="memory"
            >

            <input
                    type="hidden"
                    name="answer"
                    value="memory"
            >


            <label>
                🖼️ Выбери картинку
            </label>


            <select
                    name="imageUrl"
                    required
            >

                <option value="">
                    -- Выбери картинку --
                </option>

                <option value="/images/games/memory/apple.png">
                    🍎 Яблоко
                </option>

                <option value="/images/games/memory/cat.png">
                    🐱 Кот
                </option>

                <option value="/images/games/memory/bicycle.png">
                    🚲 Велосипед
                </option>

                <option value="/images/games/memory/rocket.png">
                    🚀 Ракета
                </option>

                <option value="/images/games/memory/guitar.png">
                    🎸 Гитара
                </option>

                <option value="/images/games/memory/pizza.png">
                    🍕 Пицца
                </option>

            </select>


            <button
                    type="submit"
                    class="button"
            >
                🧩 Добавить пару
            </button>

        </form>

    </section>


    <!-- =========================
         СПИСОК ЗАДАНИЙ
         ========================= -->

    <section class="admin-section">

        <h2>
            📋 Все задания
        </h2>


        <div class="mini-game-tasks-list">


            <div
                    class="mini-game-task-card"
                    th:each="task : ${tasks}"
            >


                <!-- =========================
                     ОСНОВНАЯ ИНФОРМАЦИЯ
                     ========================= -->

                <div class="mini-game-task-main">


                    <div class="mini-game-task-content">


                        <!-- MEMORY -->

                        <div
                                th:if="${miniGame.gameType == 'MEMORY'}"
                        >

                            <img
                                    th:src="${task.imageUrl}"
                                    alt="Картинка пары"
                                    class="memory-admin-image"
                            >

                            <span>
                                🖼️ Пара
                            </span>

                        </div>


                        <!-- WORD / CROCODILE -->

                        <div
                                th:unless="${miniGame.gameType == 'MEMORY'}"
                        >

                            <strong
                                    th:text="${task.content}"
                            >
                                Задание
                            </strong>

                            <span>
                                →
                            </span>

                            <strong
                                    th:text="${task.answer}"
                            >
                                Ответ
                            </strong>

                        </div>

                    </div>


                    <!-- Статус -->

                    <div class="mini-game-task-status">

                        <span
                                th:if="${task.active}"
                                class="mini-game-active"
                        >
                            🟢 Активно
                        </span>

                        <span
                                th:unless="${task.active}"
                                class="mini-game-inactive"
                        >
                            ⚪ Выключено
                        </span>

                    </div>

                </div>


                <!-- =========================
                     КНОПКИ
                     ========================= -->

                <div class="mini-game-task-actions">


                    <button
                            type="button"
                            class="mini-game-edit-button"
                            th:onclick="'toggleTaskEdit(' + ${task.id} + ')'"
                    >
                        ✏️
                    </button>


                    <form
                            th:action="@{'/admin/mini-game/task/delete/' + ${task.id}}"
                            method="post"
                    >

                        <button
                                type="submit"
                                class="mini-game-delete-button"
                                onclick="return confirm('Удалить это задание?');"
                        >
                            🗑️
                        </button>

                    </form>

                </div>


                <!-- =========================
                     РЕДАКТИРОВАНИЕ
                     ========================= -->

                <form
                        th:id="'task-edit-' + ${task.id}"
                        class="mini-game-task-edit-form"
                        th:action="@{'/admin/mini-game/task/edit/' + ${task.id}}"
                        method="post"
                        style="display: none;"
                >


                    <!-- =========================
                         WORD
                         ========================= -->

                    <div
                            th:if="${miniGame.gameType == 'WORD'}"
                    >

                        <input
                                type="text"
                                name="content"
                                th:value="${task.content}"
                                placeholder="Задание / слово"
                                required
                        >

                        <input
                                type="text"
                                name="answer"
                                th:value="${task.answer}"
                                placeholder="Правильный ответ"
                                required
                        >

                    </div>


                    <!-- =========================
                         CROCODILE
                         ========================= -->

                    <div
                            th:if="${miniGame.gameType == 'CROCODILE'}"
                    >

                        <input
                                type="text"
                                name="content"
                                th:value="${task.content}"
                                placeholder="Слово или задание"
                                required
                        >

                        <!-- Для Крокодила answer
                             автоматически берётся из content -->

                        <input
                                type="hidden"
                                name="answer"
                                value=""
                        >

                    </div>


                    <!-- Настройки Крокодила -->

                    <div
                            th:if="${miniGame.gameType == 'CROCODILE'}"
                            class="crocodile-task-options"
                    >

                        <label>
                            Сложность

                            <select name="difficulty">

                                <option
                                        value="EASY"
                                        th:selected="${task.difficulty == 'EASY'}"
                                >
                                    🟢 Легко
                                </option>

                                <option
                                        value="MEDIUM"
                                        th:selected="${task.difficulty == 'MEDIUM'}"
                                >
                                    🟡 Средне
                                </option>

                                <option
                                        value="HARD"
                                        th:selected="${task.difficulty == 'HARD'}"
                                >
                                    🔴 Сложно
                                </option>

                            </select>

                        </label>


                        <label>
                            Тип задания

                            <select name="taskType">

                                <option
                                        value="WORD"
                                        th:selected="${task.taskType == 'WORD'}"
                                >
                                    🗣️ Слово или словосочетание
                                </option>

                                <option
                                        value="SITUATION"
                                        th:selected="${task.taskType == 'SITUATION'}"
                                >
                                    🎭 Ситуация
                                </option>

                            </select>

                        </label>

                    </div>


                    <!-- =========================
                         MEMORY
                         ========================= -->

                    <div
                            th:if="${miniGame.gameType == 'MEMORY'}"
                    >

                        <label>
                            🖼️ Картинка
                        </label>


                        <select
                                name="imageUrl"
                                required
                        >

                            <option
                                    value="/images/games/memory/apple.png"
                                    th:selected="${task.imageUrl == '/images/games/memory/apple.png'}"
                            >
                                🍎 Яблоко
                            </option>

                            <option
                                    value="/images/games/memory/cat.png"
                                    th:selected="${task.imageUrl == '/images/games/memory/cat.png'}"
                            >
                                🐱 Кот
                            </option>

                            <option
                                    value="/images/games/memory/bicycle.png"
                                    th:selected="${task.imageUrl == '/images/games/memory/bicycle.png'}"
                            >
                                🚲 Велосипед
                            </option>

                            <option
                                    value="/images/games/memory/rocket.png"
                                    th:selected="${task.imageUrl == '/images/games/memory/rocket.png'}"
                            >
                                🚀 Ракета
                            </option>

                            <option
                                    value="/images/games/memory/guitar.png"
                                    th:selected="${task.imageUrl == '/images/games/memory/guitar.png'}"
                            >
                                🎸 Гитара
                            </option>

                            <option
                                    value="/images/games/memory/pizza.png"
                                    th:selected="${task.imageUrl == '/images/games/memory/pizza.png'}"
                            >
                                🍕 Пицца
                            </option>

                        </select>

                    </div>


                    <!-- Активность задания -->

                    <label class="admin-checkbox">

                        <input
                                type="checkbox"
                                name="active"
                                value="true"
                                th:checked="${task.active}"
                        >

                        🟢 Задание активно

                    </label>


                    <!-- Кнопки -->

                    <div class="admin-edit-actions">

                        <button
                                type="submit"
                                class="button"
                        >
                            💾 Сохранить
                        </button>


                        <button
                                type="button"
                                class="button secondary-button"
                                th:onclick="'toggleTaskEdit(' + ${task.id} + ')'"
                        >
                            Отмена
                        </button>

                    </div>

                </form>

            </div>


            <!-- Нет заданий -->

            <p
                    th:if="${#lists.isEmpty(tasks)}"
                    class="empty-message"
            >
                Пока нет заданий.
            </p>

        </div>

    </section>

</div>


<script>

    function toggleTaskEdit(id) {

        const form =
            document.getElementById('task-edit-' + id);

        if (
            form.style.display === 'none'
            || form.style.display === ''
        ) {

            form.style.display = 'block';

        } else {

            form.style.display = 'none';

        }
    }

</script>

</body>

</html>
