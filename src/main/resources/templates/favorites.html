<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Избранное</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div class="container">

    <h1>Избранное</h1>

    <div th:if="${favorites.isEmpty()}">

        <p>
            У тебя пока нет избранных занятий
        </p>

        <a class="button"
           th:href="@{/}">
            Вернуться на главную
        </a>

    </div>

    <div th:unless="${favorites.isEmpty()}">

        <div th:each="favorite : ${favorites}"
             class="activity-card">

            <div class="activity-image"
                 th:if="${favorite.snapshotImageUrl != null and !#strings.isEmpty(favorite.snapshotImageUrl)}">
                <img th:src="${favorite.snapshotImageUrl}" alt="Изображение занятия">
            </div>

            <h2 th:text="${favorite.snapshotTitle}">Название</h2>
            <p class="activity-description" th:text="${favorite.snapshotDescription}">Описание</p>

            <p>⏱ <span th:text="${favorite.snapshotDuration}">30</span> минут</p>
            <p>📍 <span th:text="${favorite.snapshotLocation}">Дом</span></p>

            <div class="activity-section"
                 th:if="${favorite.snapshotInstructions != null and !#strings.isEmpty(favorite.snapshotInstructions)}">
                <h3>📝 Что нужно сделать</h3>
                <p class="activity-text" th:text="${favorite.snapshotInstructions}"></p>
            </div>

            <div class="activity-section"
                 th:if="${favorite.snapshotBenefit != null and !#strings.isEmpty(favorite.snapshotBenefit)}">
                <h3>💡 Зачем это делать</h3>
                <p class="activity-text" th:text="${favorite.snapshotBenefit}"></p>
            </div>

            <div class="activity-section fact-section"
                 th:if="${favorite.snapshotInterestingFact != null and !#strings.isEmpty(favorite.snapshotInterestingFact)}">
                <h3>🤓 Интересный факт</h3>
                <p class="activity-text" th:text="${favorite.snapshotInterestingFact}"></p>
            </div>

            <div class="activity-materials"
                 th:if="${(favorite.snapshotVideoUrl != null and !#strings.isEmpty(favorite.snapshotVideoUrl)) or (favorite.snapshotLinkUrl != null and !#strings.isEmpty(favorite.snapshotLinkUrl))}">
                <h3>📎 Полезные материалы</h3>
                <a class="material-button"
                   th:if="${favorite.snapshotVideoUrl != null and !#strings.isEmpty(favorite.snapshotVideoUrl)}"
                   th:href="${favorite.snapshotVideoUrl}" target="_blank" rel="noopener noreferrer">
                    🎬 Смотреть видео
                </a>
                <a class="material-button"
                   th:if="${favorite.snapshotLinkUrl != null and !#strings.isEmpty(favorite.snapshotLinkUrl)}"
                   th:href="${favorite.snapshotLinkUrl}" target="_blank" rel="noopener noreferrer">
                    🔗 Открыть полезный материал
                </a>
            </div>

            <form th:action="@{'/favorites/delete/' + ${favorite.id}}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="button">Удалить</button>
            </form>

        </div>

    </div>

    <br>

    <a class="button"
       th:href="@{/}">
        На главную
    </a>

</div>

</body>
</html>
