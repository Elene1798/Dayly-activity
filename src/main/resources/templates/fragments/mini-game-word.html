<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title th:text="${miniGame.title}">
        Собери слово
    </title>

    <link rel="stylesheet"
          th:href="@{/css/style.css(v=3)}">

</head>

<body>

<div class="container">

    <div class="card word-game-card">

        <p class="word-game-description"
           th:text="${miniGame.description}">
            Собери правильное слово из букв.
        </p>

        <div class="word-game-content"
             data-word-game
             th:attr="
        data-answer=${task.answer},
        data-activity-id=${activityId},
        data-task-id=${task.id},
        data-standalone=${activityId == null}">

            <p class="word-game-task" th:text="${task.content}">
                Собери слово
            </p>

            <!-- Поле для собранных букв -->
            <div class="word-game-answer"></div>

            <!-- Перемешанные буквы -->
            <div class="word-game-letters"></div>

            <!-- Кнопки: Проверить и Играть ещё -->
            <button type="button" class="button word-game-check">
                Проверить
            </button>
            <button type="button" class="button word-game-play-again" hidden>
                Играть ещё
            </button>

            <div class="word-game-result"></div>

            <!-- Форма для отправки -->
            <form class="word-game-complete-form" style="display: none;">
                <input type="hidden" name="activityId" th:value="${activityId}">
                <input type="hidden" name="taskId" th:value="${task.id}">
                <input type="hidden" name="answer" class="word-game-submitted-answer">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            </form>

        </div>

    </div>

</div>

<script th:src="@{/js/games/word-game.js}"></script>

    <div th:replace="~{fragments/achievement-notification :: notification}"></div>

</body>

</html>
