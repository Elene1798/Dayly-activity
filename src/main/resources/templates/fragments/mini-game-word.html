<div class="mini-game-inline"
     data-word-game
     th:attr="
        data-answer=${task.answer},
        data-activity-id=${activityId},
        data-task-id=${task.id}">

    <p class="word-game-task"
       th:text="${task.content}">
        Собери слово
    </p>

    <div class="word-game-answer"></div>

    <div class="word-game-letters"></div>

    <button type="button"
            class="button word-game-check">
        Проверить
    </button>

    <div class="word-game-result"></div>

    <form class="word-game-complete-form"
          th:action="@{/mini-game/complete}"
          method="post">

        <input type="hidden"
               name="activityId"
               th:value="${activityId}">

        <input type="hidden"
               name="taskId"
               th:value="${task.id}">

        <input type="hidden"
               name="answer"
               class="word-game-submitted-answer">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">
    </form>

</div>
