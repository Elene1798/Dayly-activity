<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Daily Activity</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<div class="top-menu">

    <div class="top-menu-right">

        <div th:if="${#authorization.expression('isAuthenticated()')}">

            <span class="username">
                👤
                <span th:text="${#authentication.name}">
                    Пользователь
                </span>
            </span>

            <a th:href="@{/favorites}"
               class="top-link">
                Избранное
            </a>

            <form th:action="@{/logout}"
                  method="post"
                  class="logout-form">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit"
                        class="top-link logout-button">
                    Выйти
                </button>

            </form>

        </div>

        <div th:unless="${#authorization.expression('isAuthenticated()')}">

            <a th:href="@{/login}"
               class="top-link">
                Вход
            </a>

            <a th:href="@{/register}"
               class="top-link register-link">
                Регистрация
            </a>

        </div>

    </div>

</div>


<div class="container home-container">

    <div class="hero">

        <div class="hero-badge">
            ✨ Daily Activity
        </div>

        <h1>
            Чем займёмся сегодня?
        </h1>

        <p class="subtitle">
            Выбери то, чего хочется прямо сейчас
        </p>

    </div>


    <form action="/activity"
          method="get"
          class="activity-form">


        <!-- =========================
             КАТЕГОРИИ
             ========================= -->

        <h2>
            Что тебе хочется?
        </h2>


        <div class="categories">


            <label class="category-card">

                <input type="radio"
                       name="category"
                       value="active"
                       required>

                <span class="category-content">

                    <span class="category-icon">
                        🏃
                    </span>

                    <span class="category-title">
                        Активность
                    </span>

                    <span class="category-description">
                        Двигаться и быть активнее
                    </span>

                </span>

            </label>


            <label class="category-card">

                <input type="radio"
                       name="category"
                       value="creative">

                <span class="category-content">

                    <span class="category-icon">
                        🎨
                    </span>

                    <span class="category-title">
                        Творчество
                    </span>

                    <span class="category-description">
                        Создать что-то новое
                    </span>

                </span>

            </label>


            <label class="category-card">

                <input type="radio"
                       name="category"
                       value="learning">

                <span class="category-content">

                    <span class="category-icon">
                        📚
                    </span>

                    <span class="category-title">
                        Обучение
                    </span>

                    <span class="category-description">
                        Узнать что-нибудь новое
                    </span>

                </span>

            </label>


            <label class="category-card">

                <input type="radio"
                       name="category"
                       value="entertainment">

                <span class="category-content">

                    <span class="category-icon">
                        🎮
                    </span>

                    <span class="category-title">
                        Развлечения
                    </span>

                    <span class="category-description">
                        Отдохнуть и получить удовольствие
                    </span>

                </span>

            </label>

            <label class="category-card couple-card">

                <input type="radio"
                       name="category"
                       value="couple">

                <span class="category-content">

                    <span class="category-icon">
                        💕
                    </span>

                    <span class="category-title">
                        Для двоих
                    </span>

                    <span class="category-description">
                        Провести время вместе
                    </span>

                </span>

            </label>

            <a href="/surprise"
               class="category-card surprise-card">

                <span class="category-content">

                    <span class="category-icon">
                        ✨
                    </span>

                    <span class="category-title">
                        Удиви меня
                    </span>

                    <span class="category-description">
                        Выбери что-нибудь случайное
                    </span>

                </span>

            </a>


        </div>


        <!-- =========================
             ВРЕМЯ
             ========================= -->

        <h2 class="section-title">
            Сколько у тебя времени?
        </h2>


        <div class="time-options">


            <label class="time-card">

                <input type="radio"
                       name="duration"
                       value="15">


                <span>⚡</span>
                <span>15 минут</span>

            </label>


            <label class="time-card">

                <input type="radio"
                       name="duration"
                       value="30">

                <span>🕐</span>
                <span>30 минут</span>

            </label>


            <label class="time-card">

                <input type="radio"
                       name="duration"
                       value="60">

                <span>🕑</span>
                <span>1 час</span>

            </label>


            <label class="time-card">

                <input type="radio"
                       name="duration"
                       value="120">

                <span>🌙</span>
                <span>2 часа</span>

            </label>


        </div>


        <!-- =========================
             МЕСТО
             ========================= -->

        <h2 class="section-title">
            Где ты находишься?
        </h2>


        <div class="time-options">


            <label class="time-card">

                <input type="radio"
                       name="location"
                       value="home">

                <span>🏠</span>
                <span>Дома</span>

            </label>


            <label class="time-card">

                <input type="radio"
                       name="location"
                       value="outside">

                <span>🌳</span>
                <span>На улице</span>

            </label>


            <label class="time-card">

                <input type="radio"
                       name="location"
                       value="friends">

                <span>👥</span>
                <span>С друзьями</span>

            </label>


            <label class="time-card">

                <input type="radio"
                       name="location"
                       value="anywhere">

                <span>🌎</span>
                <span>Где угодно</span>

            </label>


        </div>


        <!-- =========================
             КНОПКА
             ========================= -->

        <div class="button-container">

            <button class="button"
                    type="submit">

                🎲 Подобрать занятие

            </button>

        </div>


    </form>

</div>

</body>

</html>
