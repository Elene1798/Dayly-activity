<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Вход — Daily Activity</title>
    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<header class="site-header">

    <div class="site-header-brand-group">
        <a th:href="@{/}" class="site-header-brand">
            <span class="hero-badge">✨ Daily Activity</span>
        </a>

        <a th:href="@{/mini-games}"
           class="mini-games-header-link"
           title="Мини-игры"
           aria-label="Мини-игры">
            <img src="/images/mini-console.png"
                 alt=""
                 class="pixel-console">
        </a>

        <a th:href="@{/advent}"
           class="advent-header-link"
           title="Адвент-активность"
           aria-label="Адвент-активность">

    <span class="advent-header-link__month"
          th:if="${monthLabel != null and !monthLabel.isEmpty()}"
          th:text="${monthLabel}">
        Дек
    </span>

            <span class="advent-header-link__divider"
                  th:if="${monthLabel != null and !monthLabel.isEmpty()}">
    </span>

            <span class="advent-header-link__day"
                  th:text="${dayNumber}">
        15
    </span>

        </a>
    </div>

    <nav class="site-header-actions">

       <a th:href="@{/register}"
           class="site-header-link site-header-register">
            Регистрация
        </a>

    </nav>

</header>

<div class="container">

    <h1>Вход</h1>

    <p th:if="${error}"
       th:text="${error}"
       class="auth-error">
    </p>

    <p th:if="${success}"
       th:text="${success}"
       class="auth-success">
    </p>

    <form th:action="@{/login}"
          method="post"
          class="auth-form">

        <label for="username">
            Логин
        </label>

        <input
                id="username"
                type="text"
                name="username"
                required
                autocomplete="username">

        <label for="password">
            Пароль
        </label>

        <div class="password-field">
            <input
                    id="password"
                    type="password"
                    name="password"
                    required
                    autocomplete="current-password">

            <button type="button"
                    class="password-toggle"
                    data-password-toggle
                    aria-label="Показать пароль"
                    title="Показать пароль">
                🐵
            </button>
        </div>

        <div class="remember-me">
            <label>
                <input type="checkbox"
                       name="remember-me">
                Запомнить меня
            </label>
        </div>

        <button class="button"
                type="submit">
            Войти
        </button>

    </form>

    <p class="auth-link">
        Еще нет аккаунта?
        <a th:href="@{/register}">
            Зарегистрируйтесь
        </a>
    </p>

</div>

<script th:src="@{/js/games/password-toggle.js}"></script>

</body>
</html>
