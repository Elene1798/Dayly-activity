<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title th:text="${miniGame.title}">
        Собери слово
    </title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="container">

    <div class="card word-game-card">

        <h1 th:text="${miniGame.title}">
            Собери слово
        </h1>

        <p class="word-game-description"
           th:text="${miniGame.description}">
            Собери правильное слово из букв.
        </p>

        <div class="word-game-content"
             data-word-game
             th:attr="
        data-answer=${task.answer},
        data-activity-id=${activityId},
        data-task-id=${task.id}">

            <p class="word-game-task"
               th:text="${task.content}">
                Собери слово
            </p>

            <div class="word-game-answer"></div>

            <div class="word-game-letters"></div>

            <button type="button"
                    class="button word-game-check">
                Проверить
            </button>

            <div class="word-game-result"></div>

            <form class="word-game-complete-form"
                  th:action="@{/mini-game/complete}"
                  method="post">

                <input type="hidden"
                       name="activityId"
                       th:value="${activityId}">

                <input type="hidden"
                       name="taskId"
                       th:value="${task.id}">

                <input type="hidden"
                       name="answer"
                       class="word-game-submitted-answer">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

            </form>

        </div>

    </div>

</div>

<script th:src="@{/js/games/word-game.js}"></script>

</body>

</html>
