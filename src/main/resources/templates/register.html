<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Регистрация — Daily Activity</title>
    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div class="container">

    <h1>Регистрация</h1>

    <p th:if="${error}"
       th:text="${error}"
       class="auth-error">
    </p>

    <form th:action="@{/register}"
          method="post"
          class="auth-form">

        <label for="username">
            Логин
        </label>

        <input
                id="username"
                type="text"
                name="username"
                required
                autocomplete="username">

        <label for="password">
            Пароль
        </label>

        <input
                id="password"
                type="password"
                name="password"
                required
                autocomplete="new-password">

        <button class="button"
                type="submit">
            Зарегистрироваться
        </button>

    </form>

    <p class="auth-link">
        Уже есть аккаунт?
        <a th:href="@{/login}">
            Войти
        </a>
    </p>

</div>

</body>
</html>
